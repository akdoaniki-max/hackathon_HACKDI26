<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ummah Local NJ</title>
	<link rel="preconnect" href="https://unpkg.com">
	<link rel="preconnect" href="https://tiles.stadiamaps.com">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<div class="app-shell">
		<aside class="directory" aria-label="Community business directory">
			<header class="brand-block">
				<div class="brand-mark" aria-hidden="true">UL</div>
				<div>
					<h1>Ummah Local NJ</h1>
					<p>Find and share Muslim-owned or Muslim-serving businesses across New Jersey.</p>
				</div>
			</header>

			<div class="toolbar" aria-label="Map controls">
				<button class="primary-button" id="locateButton" type="button">
					<i data-lucide="locate-fixed" aria-hidden="true"></i>
					<span>Use my location</span>
				</button>
				<button class="icon-button" id="resetButton" type="button" aria-label="Reset map to New Jersey">
					<i data-lucide="map-pinned" aria-hidden="true"></i>
				</button>
			</div>

			<section class="status-panel" aria-live="polite">
				<strong id="listingCount">Loading listings</strong>
				<span id="statusText">Click the map to add a business pin.</span>
			</section>

			<section class="listings" aria-label="Business listings">
				<div id="listingList" class="listing-list"></div>
			</section>
		</aside>

		<main class="map-stage">
			<div id="map" aria-label="Interactive map of New Jersey business listings"></div>
		</main>

		<aside class="composer" id="composer" aria-label="Add a business listing" aria-hidden="true">
			<div class="composer-header">
				<div>
					<h2>Add a business pin</h2>
					<p id="selectedLocation">Choose a location on the map.</p>
				</div>
				<button class="icon-button" id="closeComposer" type="button" aria-label="Close form">
					<i data-lucide="x" aria-hidden="true"></i>
				</button>
			</div>

			<form id="listingForm">
				<label>
					<span>Your name</span>
					<input name="ownerName" maxlength="80" required autocomplete="name"
						placeholder="Mohammad Shaheer Siddiqi">
				</label>

				<label>
					<span>Business name</span>
					<input name="businessName" maxlength="100" required placeholder="Shaheer Barber Studio">
				</label>

				<label>
					<span>Category</span>
					<select name="category" required>
						<option value="BARBER">Barber</option>
						<option value="FOOD">Food</option>
						<option value="CLOTHING">Clothing</option>
						<option value="EDUCATION">Education</option>
						<option value="HEALTH">Health</option>
						<option value="SERVICES">Services</option>
						<option value="RETAIL">Retail</option>
						<option value="OTHER">Other</option>
					</select>
				</label>

				<label>
					<span>Website or booking link</span>
					<input name="websiteUrl" maxlength="255" inputmode="url" placeholder="https://your-site.com">
				</label>

				<label>
					<span>Community note</span>
					<textarea name="comment" maxlength="500" required
						placeholder="What do you offer, where do you serve, and how should people reach you?"></textarea>
				</label>

				<input name="latitude" type="hidden">
				<input name="longitude" type="hidden">

				<p class="form-message" id="formMessage" role="status"></p>

				<button class="primary-button submit-button" type="submit">
					<i data-lucide="send" aria-hidden="true"></i>
					<span>Publish pin</span>
				</button>
			</form>
		</aside>
	</div>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
	<script src="/app.js"></script>
</body>
</html>
